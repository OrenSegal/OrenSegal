name: validate
on:
  pull_request:
    paths: [".claude-plugin/**", ".github/workflows/validate.yml"]
  push:
    branches: [main]
    paths: [".claude-plugin/**", ".github/workflows/validate.yml"]
permissions:
  contents: read
jobs:
  marketplace:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: npm install -g @anthropic-ai/claude-code
      - run: claude plugin validate .
